
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duel Assistant">
  <meta name="theme-color" content="#b7aa9a">

  <title>Duel Assistant</title>

  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/png" href="./icon-180.png">

  <style>
    :root {
      --background: #b7aa9a;
      --panel: #302c29;
      --panel-light: #403a35;
      --orange: #f5822a;
      --orange-dark: #bd5d19;
      --cream: #f5ecdf;
      --muted: #b9afa4;
      --border: #77695b;
      --danger: #d66a45;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(16px, env(safe-area-inset-top))
        14px
        max(14px, env(safe-area-inset-bottom));
      background: var(--background);
      color: var(--panel);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      overscroll-behavior-y: contain;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.97);
    }

    .app {
      width: 100%;
      max-width: 650px;
      min-height: calc(100vh - 30px);
      min-height: calc(100dvh - 30px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 3px 2px 5px;
    }

    .logo-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 2px solid var(--orange);
      border-radius: 12px;
      background: var(--panel);
      color: var(--orange);
      font-size: 22px;
      font-weight: 900;
    }

    .header-text {
      min-width: 0;
      flex: 1;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(19px, 5vw, 25px);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 800;
      opacity: 0.75;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .player {
      min-width: 0;
      padding: 12px 9px;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      color: var(--cream);
      box-shadow: 0 4px 0 rgba(48, 44, 41, 0.12);
    }

    .player-name {
      margin-bottom: 9px;
      color: var(--orange);
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.4px;
    }

    .lp-value {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 53px;
      margin-bottom: 6px;
      padding: 4px 0;
      border: 1px solid #514940;
      border-radius: 9px;
      background: #252220;
      color: var(--cream);
      font-size: clamp(27px, 7vw, 39px);
      font-weight: 900;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      overflow: hidden;
    }

    .lp-value input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .edit-hint {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }

    .main-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .control-btn {
      min-height: 43px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-light);
      color: var(--cream);
      font-size: 25px;
      font-weight: 800;
    }

    .control-btn.plus {
      border-color: var(--orange);
      background: var(--orange);
      color: #241d18;
    }

    .secondary-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    .small-btn {
      min-height: 32px;
      padding: 5px 2px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
    }

    .section {
      padding: 12px;
      border: 1px solid rgba(48, 44, 41, 0.18);
      border-radius: 14px;
      background: rgba(245, 236, 223, 0.35);
    }

    .section-title {
      margin: 0 0 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--orange);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .amount-buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .amount-btn {
      min-height: 38px;
      padding: 5px 2px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--cream);
      font-size: 13px;
      font-weight: 800;
    }

    .amount-btn.active {
      border-color: var(--orange);
      background: var(--orange);
      color: #241d18;
    }

    .custom-label {
      display: block;
      margin: 12px 0 6px;
      font-size: 12px;
      font-weight: 800;
    }

    #customAmount {
      display: block;
      width: 100%;
      min-height: 43px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--panel);
      color: var(--cream);
      font-size: 16px;
    }

    #customAmount:focus {
      border-color: var(--orange);
    }

    .notes-section {
      display: flex;
      flex: 1 0 150px;
      flex-direction: column;
      min-height: 150px;
    }

    .notes-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }

    .notes-heading .section-title {
      flex: 1;
      margin-bottom: 10px;
    }

    .clear-notes {
      width: 34px;
      height: 34px;
      margin-top: -7px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--orange);
      font-size: 17px;
    }

    #notes {
      flex: 1 1 auto;
      width: 100%;
      min-height: 100px;
      resize: vertical;
      background: var(--panel);
      color: var(--cream);
      border: 2px solid var(--border);
      border-radius: 11px;
      padding: 10px;

      /* Modifica: 16px evita lo zoom automatico di Safari su iPhone. */
      font-size: 16px;

      line-height: 1.45;
    }

    #notes::placeholder {
      color: #b9afa4;
      opacity: 1;
    }

    #notes:focus {
      border-color: var(--orange);
      outline: none;
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px 48px;
      gap: 9px;
      margin-top: auto;
      padding-top: 2px;
    }

    .newduel {
      min-height: 49px;
      padding: 10px 8px;
      border: 0;
      border-radius: 12px;
      background: var(--orange);
      color: #241d18;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 0 var(--orange-dark);
    }

    .random-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      min-height: 49px;
      border: 2px solid var(--orange);
      border-radius: 12px;
      background: var(--panel);
      color: var(--orange);
      font-size: 26px;
      font-weight: 900;
    }

    .coin-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 2px solid var(--orange);
      border-radius: 50%;
      font-size: 10px;
      letter-spacing: -0.5px;
    }

    .random-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(20, 18, 16, 0.82);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .random-overlay.visible {
      display: flex;
    }

    .random-dialog {
      width: 100%;
      max-width: 310px;
      padding: 24px 18px 18px;
      border: 2px solid var(--orange);
      border-radius: 20px;
      background: var(--panel);
      color: var(--cream);
      text-align: center;
      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.35);
    }

    .random-result {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 125px;
      margin-bottom: 18px;
      color: var(--orange);
      font-size: 76px;
      font-weight: 900;
      line-height: 1;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .random-result.rolling {
      opacity: 0;
      transform: scale(0.75) rotate(-8deg);
    }

    .random-result.coin-result {
      width: 120px;
      height: 120px;
      min-height: 120px;
      margin: 0 auto 23px;
      border: 5px solid var(--orange);
      border-radius: 50%;
      background: #252220;
      color: var(--cream);
      font-size: 42px;
      box-shadow: inset 0 0 0 4px #514940;
    }

    .random-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .random-actions button {
      min-height: 43px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-light);
      color: var(--cream);
      font-size: 12px;
      font-weight: 900;
    }

    .random-actions .reroll {
      border-color: var(--orange);
      background: var(--orange);
      color: #241d18;
    }

    @media (max-height: 700px) {
      .app {
        gap: 9px;
      }

      .player {
        padding: 9px 7px;
      }

      .lp-value {
        min-height: 44px;
      }

      .control-btn {
        min-height: 37px;
      }

      .section {
        padding: 9px;
      }

      .notes-section {
        flex-basis: 120px;
        min-height: 120px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="logo-mark" aria-hidden="true">LP</div>
      <div class="header-text">
        <h1>DUEL ASSISTANT</h1>
        <div class="subtitle">LIFE POINTS &amp; NOTES</div>
      </div>
    </header>

    <section class="players" aria-label="Punti vita dei giocatori">
      <article class="player">
        <div class="player-name">AVVERSARIO</div>
        <div class="lp-value">
          <input id="lp0" type="text" inputmode="numeric"
            pattern="[0-9]*" value="8000"
            aria-label="Punti vita avversario">
        </div>
        <div class="edit-hint">Tocca il numero per modificarlo</div>
        <div class="main-buttons">
          <button class="control-btn" data-player="0" data-action="minus"
            aria-label="Diminuisci i punti vita avversario">−</button>
          <button class="control-btn plus" data-player="0" data-action="plus"
            aria-label="Aumenta i punti vita avversario">+</button>
        </div>
        <div class="secondary-buttons">
          <button class="small-btn" data-player="0" data-action="half">½ LP</button>
          <button class="small-btn" data-player="0" data-action="reset">RESET</button>
        </div>
      </article>

      <article class="player">
        <div class="player-name">TU</div>
        <div class="lp-value">
          <input id="lp1" type="text" inputmode="numeric"
            pattern="[0-9]*" value="8000"
            aria-label="I tuoi punti vita">
        </div>
        <div class="edit-hint">Tocca il numero per modificarlo</div>
        <div class="main-buttons">
          <button class="control-btn" data-player="1" data-action="minus"
            aria-label="Diminuisci i tuoi punti vita">−</button>
          <button class="control-btn plus" data-player="1" data-action="plus"
            aria-label="Aumenta i tuoi punti vita">+</button>
        </div>
        <div class="secondary-buttons">
          <button class="small-btn" data-player="1" data-action="half">½ LP</button>
          <button class="small-btn" data-player="1" data-action="reset">RESET</button>
        </div>
      </article>
    </section>

    <section class="section">
      <h2 class="section-title">IMPORTO OPERAZIONI</h2>
      <div class="amount-buttons">
        <button class="amount-btn" data-amount="200">200</button>
        <button class="amount-btn active" data-amount="500">500</button>
        <button class="amount-btn" data-amount="1000">1000</button>
        <button class="amount-btn" data-amount="3000">3000</button>
      </div>
      <label class="custom-label" for="customAmount">Personalizza importo</label>
      <input id="customAmount" type="number" inputmode="numeric"
        min="0" step="1" value="500">
    </section>

    <section class="section notes-section">
      <div class="notes-heading">
        <h2 class="section-title">NOTE DEL DUELLO</h2>
        <button id="clearNotes" class="clear-notes"
          aria-label="Cancella le note" title="Cancella le note">⌫</button>
      </div>
      <textarea id="notes"
        placeholder="Scrivi effetti, carte, calcoli o promemoria…"
        aria-label="Note del duello"></textarea>
    </section>

    <div class="bottom-actions">
      <button class="newduel" id="newDuel">↻ &nbsp; NUOVO DUELLO</button>
      <button class="random-btn" id="coinFlip"
        aria-label="Lancia una moneta" title="Lancia una moneta">
        <span class="coin-icon" aria-hidden="true">T/C</span>
      </button>
      <button class="random-btn" id="rollDice"
        aria-label="Lancia un dado" title="Lancia un dado">⚄</button>
    </div>
  </main>

  <div class="random-overlay" id="randomOverlay"
    role="dialog" aria-modal="true" aria-label="Risultato casuale">
    <div class="random-dialog">
      <div class="random-result" id="randomResult"></div>
      <div class="random-actions">
        <button class="reroll" id="reroll">RILANCIA</button>
        <button id="closeRandom">CHIUDI</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "duel-assistant-data";
      const DEFAULT_LP = 8000;

      const lpInputs = [
        document.getElementById("lp0"),
        document.getElementById("lp1")
      ];

      const customAmount = document.getElementById("customAmount");
      const notes = document.getElementById("notes");
      const overlay = document.getElementById("randomOverlay");
      const randomResult = document.getElementById("randomResult");

      let selectedAmount = 500;
      let undoStack = [];
      let randomType = "coin";
      let rollTimer = null;

      function parseNumber(value, fallback = 0) {
        const parsed = Number.parseInt(String(value), 10);
        return Number.isFinite(parsed) ? Math.max(0, parsed) : fallback;
      }

      function getLP(player) {
        return parseNumber(lpInputs[player].value, 0);
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            lp: [getLP(0), getLP(1)],
            amount: parseNumber(customAmount.value, selectedAmount),
            notes: notes.value
          }));
        } catch (error) {
          // L'app continua a funzionare anche se lo spazio locale non è disponibile.
        }
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;

          const data = JSON.parse(raw);

          if (Array.isArray(data.lp) && data.lp.length === 2) {
            lpInputs[0].value = String(parseNumber(data.lp[0], DEFAULT_LP));
            lpInputs[1].value = String(parseNumber(data.lp[1], DEFAULT_LP));
          }

          if (data.amount !== undefined) {
            const amount = parseNumber(data.amount, selectedAmount);
            customAmount.value = String(amount);
            selectedAmount = amount;
          }

          if (typeof data.notes === "string") {
            notes.value = data.notes;
          }

          updateAmountButtons();
        } catch (error) {
          // Se i dati salvati non sono leggibili, si usano i valori iniziali.
        }
      }

      function rememberState() {
        undoStack.push({
          lp: [getLP(0), getLP(1)],
          amount: parseNumber(customAmount.value, selectedAmount),
          notes: notes.value
        });

        if (undoStack.length > 50) undoStack.shift();
      }

      function undo() {
        const previous = undoStack.pop();
        if (!previous) return;

        lpInputs[0].value = String(previous.lp[0]);
        lpInputs[1].value = String(previous.lp[1]);
        customAmount.value = String(previous.amount);
        notes.value = previous.notes;
        selectedAmount = previous.amount;

        updateAmountButtons();
        saveState();
      }

      function updateAmountButtons() {
        document.querySelectorAll("[data-amount]").forEach(button => {
          button.classList.toggle(
            "active",
            Number(button.dataset.amount) === selectedAmount
          );
        });
      }

      function getAmount() {
        const amount = parseNumber(customAmount.value, selectedAmount);
        return amount;
      }

      function setLP(player, value) {
        lpInputs[player].value = String(Math.max(0, Math.trunc(value)));
        saveState();
      }

      function changeLP(player, action) {
        const current = getLP(player);
        const amount = getAmount();

        rememberState();

        if (action === "plus") {
          setLP(player, current + amount);
        } else if (action === "minus") {
          setLP(player, current - amount);
        } else if (action === "half") {
          setLP(player, Math.floor(current / 2));
        } else if (action === "reset") {
          setLP(player, DEFAULT_LP);
        }
      }

      document.querySelectorAll("[data-player]").forEach(button => {
        button.addEventListener("click", () => {
          changeLP(
            Number(button.dataset.player),
            button.dataset.action
          );
        });
      });

      lpInputs.forEach(input => {
        input.addEventListener("focus", () => {
          rememberState();
          input.select();
        });

        input.addEventListener("input", () => {
          input.value = input.value.replace(/[^0-9]/g, "");
          saveState();
        });

        input.addEventListener("change", () => {
          input.value = String(parseNumber(input.value, 0));
          saveState();
        });

        input.addEventListener("blur", () => {
          input.value = String(parseNumber(input.value, 0));
          saveState();
        });
      });

      document.querySelectorAll("[data-amount]").forEach(button => {
        button.addEventListener("click", () => {
          rememberState();
          selectedAmount = Number(button.dataset.amount);
          customAmount.value = String(selectedAmount);
          updateAmountButtons();
          saveState();
        });
      });

      customAmount.addEventListener("focus", () => {
        rememberState();
      });

      customAmount.addEventListener("input", () => {
        selectedAmount = parseNumber(customAmount.value, 0);
        updateAmountButtons();
        saveState();
      });

      notes.addEventListener("input", saveState);

      document.getElementById("clearNotes").addEventListener("click", () => {
        if (!notes.value) return;

        rememberState();
        notes.value = "";
        saveState();
      });

      document.getElementById("newDuel").addEventListener("click", () => {
        const confirmed = window.confirm(
          "Iniziare un nuovo duello? Entrambi i giocatori torneranno a 8000 LP e le note saranno cancellate."
        );

        if (!confirmed) return;

        rememberState();

        lpInputs[0].value = String(DEFAULT_LP);
        lpInputs[1].value = String(DEFAULT_LP);
        notes.value = "";

        saveState();
      });

      function openRandomDialog(type) {
        randomType = type;
        overlay.classList.add("visible");
        roll();
      }

      function roll() {
        if (rollTimer !== null) {
          clearTimeout(rollTimer);
          rollTimer = null;
        }

        randomResult.classList.add("rolling");

        rollTimer = setTimeout(() => {
          if (randomType === "coin") {
            const heads = Math.random() < 0.5;
            randomResult.textContent = heads ? "T" : "C";
            randomResult.classList.add("coin-result");
            randomResult.setAttribute(
              "aria-label",
              heads ? "Testa" : "Croce"
            );
          } else {
            const result = Math.floor(Math.random() * 6) + 1;
            const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
            randomResult.textContent = diceFaces[result - 1];
            randomResult.classList.remove("coin-result");
            randomResult.setAttribute(
              "aria-label",
              "Risultato del dado: " + result
            );
          }

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              randomResult.classList.remove("rolling");
            });
          });

          rollTimer = null;
        }, 350);
      }

      function closeRandomDialog() {
        overlay.classList.remove("visible");

        if (rollTimer !== null) {
          clearTimeout(rollTimer);
          rollTimer = null;
        }

        randomResult.classList.remove("rolling");
      }

      document.getElementById("coinFlip").addEventListener("click", () => {
        openRandomDialog("coin");
      });

      document.getElementById("rollDice").addEventListener("click", () => {
        openRandomDialog("dice");
      });

      document.getElementById("reroll").addEventListener("click", roll);
      document.getElementById("closeRandom").addEventListener(
        "click",
        closeRandomDialog
      );

      overlay.addEventListener("click", event => {
        if (event.target === overlay) closeRandomDialog();
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeRandomDialog();
      });

      loadState();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {
            // La pagina resta utilizzabile anche senza registrazione offline.
          });
        });
      }
    })();
  </script>
</body>
</html>
