<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#b7aa9a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Duel Assistant">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-180.png">
<title>Duel Assistant</title>

<style>
:root {
  --taupe: #b7aa9a;
  --panel: #302c29;
  --panel-dark: #211e1c;
  --orange: #f5822a;
  --orange-dark: #c85b10;
  --cream: #f5ede2;
  --muted: #c2b8ac;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  height: 100%;
  background: var(--taupe);
  touch-action: manipulation;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  margin: 0;
  background: var(--taupe);
  color: var(--panel);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  touch-action: manipulation;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  transition: transform 90ms ease, filter 90ms ease, background-color 90ms ease;
}

button:active {
  transform: scale(0.94) translateY(1px);
  filter: brightness(0.82);
}

button:focus-visible {
  outline: 2px solid var(--cream);
  outline-offset: 2px;
}

.app {
  position: relative;
  width: 100%;
  max-width: 700px;
  height: 100%;
  margin: 0 auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  overflow: hidden;
}

.players {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  flex: 0 0 auto;
  min-height: 0;
}

.player {
  min-width: 0;
  padding: 9px 7px;
  border: 2px solid #77695b;
  border-top: 4px solid var(--orange);
  border-radius: 17px;
  background: linear-gradient(145deg, #38322e, var(--panel-dark));
  color: var(--cream);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.player h2 {
  color: var(--orange);
  font-size: clamp(12px, 3.4vw, 17px);
  text-align: center;
  margin: 1px 0 3px;
  letter-spacing: 1px;
}

.lp {
  display: block;
  width: 100%;
  min-width: 0;
  background: #171513;
  border: 2px solid #554b43;
  border-radius: 12px;
  color: var(--cream);
  font-size: clamp(25px, 7.5vw, 43px);
  font-weight: 800;
  text-align: center;
  padding: 9px 0;
  letter-spacing: 1px;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  user-select: none;
  transition: color 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
  transform-origin: center;
}

.lp.lp-changed {
  color: #ffad65;
  border-color: var(--orange);
  box-shadow: 0 0 0 2px rgba(245, 130, 42, 0.2), 0 0 20px rgba(245, 130, 42, 0.42);
  transform: scale(1.035);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: auto;
}

.btn {
  min-width: 0;
  min-height: 37px;
  border: 2px solid var(--orange-dark);
  border-radius: 11px;
  background: transparent;
  color: var(--orange);
  font-weight: 750;
  padding: 6px 2px;
}

.btn.big {
  min-height: 45px;
  font-size: 27px;
  color: var(--cream);
}

.btn.plus {
  background: linear-gradient(145deg, #ff963f, #d9600d);
  border-color: #ff9b45;
}

.btn.half,
.btn.reset {
  font-size: 12px;
}

.amountbox {
  flex: 0 0 auto;
  padding: 8px 10px;
  background: #c8bbab;
  border: 1px solid #d9cdbf;
  border-radius: 14px;
}

.section-title {
  color: var(--orange);
  font-weight: 850;
  font-size: 13px;
  letter-spacing: 1.2px;
  margin: 0 0 5px;
}

.presets {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
}

.preset {
  min-width: 0;
  min-height: 37px;
  padding: 5px 1px;
  background: var(--panel);
  color: var(--cream);
  border: 2px solid #74675b;
  border-radius: 9px;
  font-weight: 750;
  font-size: clamp(10px, 3vw, 14px);
}

.preset.active {
  background: var(--orange-dark);
  border-color: #ffad65;
}

.preset.undo {
  color: var(--orange);
  border-color: var(--orange-dark);
  font-size: 17px;
}

.customrow {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 7px;
}

.customrow label {
  color: var(--panel);
  font-size: 12px;
  font-weight: 750;
  white-space: nowrap;
}

#clearAmount {
  flex: 0 0 29px;
  width: 29px;
  height: 29px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 1px solid #8e3d0a;
  border-radius: 8px;
  background: var(--orange-dark);
  color: white;
  font-size: 19px;
  font-weight: 800;
  line-height: 1;
}

#amount {
  flex: 1 1 auto;
  width: 0;
  min-width: 0;
  background: var(--panel);
  color: var(--cream);
  border: 2px solid var(--orange);
  border-radius: 9px;
  padding: 7px 9px;
  font-size: 16px;
  scroll-margin: 0;
}

.notesbox {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 8px 9px;
  background: #c8bbab;
  border: 1px solid #d9cdbf;
  border-radius: 14px;
  overflow: hidden;
}

.notes-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex: 0 0 auto;
}

.notes-head .section-title {
  margin: 0 0 4px;
}

.iconbtn {
  flex: 0 0 auto;
  background: #a89b8b;
  border: 1px solid #948777;
  border-radius: 9px;
  padding: 4px 9px;
  color: var(--panel);
  font-size: 18px;
}

.accent-line {
  flex: 0 0 auto;
  height: 3px;
  width: 55%;
  background: var(--orange);
  border-radius: 3px;
  margin: 3px 0 7px;
}

.notes-sections {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.note-part {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.note-part-title {
  flex: 0 0 auto;
  margin: 0;
  color: var(--panel);
  font-size: 12px;
  font-weight: 850;
  letter-spacing: 0.8px;
}

.note-text {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  resize: none;
  background: var(--panel);
  color: var(--cream);
  border: 2px solid #77695b;
  border-radius: 11px;
  padding: 9px 10px;
  font-size: 16px;
  line-height: 1.4;
  -webkit-appearance: none;
  appearance: none;
  autocorrect: off;
}

.note-text::placeholder {
  color: #a99e93;
  opacity: 1;
}

/* Barra inferiore */
.bottom-actions {
  flex: 0 0 auto;
  display: flex;
  align-items: stretch;
  gap: 7px;
}

.newduel {
  flex: 1 1 auto;
  min-width: 0;
  width: auto;
  min-height: 43px;
  border: 2px solid #ad4b0c;
  border-radius: 12px;
  padding: 8px 5px;
  background: linear-gradient(110deg, #ff963f, #d9600d);
  color: white;
  font-weight: 850;
  letter-spacing: 1px;
  font-size: 13px;
}

.random-btn {
  flex: 0 0 46px;
  width: 46px;
  min-height: 43px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  overflow: hidden;
  background: var(--panel);
  color: var(--orange);
  border: 2px solid var(--orange-dark);
  border-radius: 12px;
  padding: 0;
  font-size: 23px;
  line-height: 1;
  text-align: center;
}

.coin-icon {
  width: 27px;
  height: 27px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 3px double var(--orange);
  border-radius: 50%;
  color: var(--cream);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: -1px;
  transform: rotate(-15deg);
}

.calculator-icon {
  width: 24px;
  height: 29px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 2px solid var(--orange);
  border-radius: 5px;
  color: var(--cream);
  font-size: 8px;
  font-weight: 900;
  line-height: 1;
}

.calculator-icon::before {
  content: "";
  display: block;
  width: 13px;
  height: 5px;
  border: 1px solid var(--orange);
  border-radius: 1px;
}

/* Calcolatrice */
.calculator-dialog {
  width: 100%;
  max-width: 340px;
  padding: 18px;
  border: 2px solid var(--orange-dark);
  border-radius: 20px;
  background: linear-gradient(145deg, #38322e, var(--panel-dark));
  color: var(--orange);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
}

.calculator-title {
  margin: 0 0 12px;
  text-align: center;
  font-size: 16px;
  letter-spacing: 1px;
}

.calculator-display {
  min-height: 78px;
  margin-bottom: 12px;
  padding: 9px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
  border: 2px solid #77695b;
  border-radius: 12px;
  background: #171513;
  text-align: right;
}

.calculator-expression {
  min-height: 18px;
  color: var(--muted);
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.calculator-value {
  color: var(--cream);
  font-size: clamp(26px, 8vw, 36px);
  font-weight: 850;
  line-height: 1.15;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.calculator-keys {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.calculator-keys button,
.calculator-close {
  min-width: 0;
  min-height: 48px;
  border: 2px solid var(--orange-dark);
  border-radius: 11px;
  background: var(--panel);
  color: var(--orange);
  font-size: 20px;
  font-weight: 800;
}

.calculator-keys button.operator {
  background: #3a2a20;
}

.calculator-keys button.clear {
  color: var(--cream);
  font-size: 15px;
}

.calculator-keys button.equals {
  background: linear-gradient(145deg, #ff963f, #d9600d);
  border-color: #ff9b45;
  color: #fff;
}

.calculator-close {
  width: 100%;
  min-height: 42px;
  margin-top: 10px;
  font-size: 12px;
  letter-spacing: 0.5px;
}

/* Finestre modali */
.random-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.72);
}

.random-dialog {
  width: 100%;
  max-width: 320px;
  padding: 24px 20px 18px;
  border: 2px solid var(--orange-dark);
  border-radius: 20px;
  background: linear-gradient(145deg, #38322e, var(--panel-dark));
  color: var(--orange);
  text-align: center;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
}

.random-result {
  min-height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--orange);
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 1px;
  overflow-wrap: anywhere;
  margin: 8px 0 20px;
  opacity: 1;
  transform: scale(1) rotate(0);
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.random-result.rolling {
  opacity: 0;
  transform: scale(0.55) rotate(-30deg);
  transition: opacity 0.12s ease, transform 0.12s ease;
}

.random-result .coin-icon {
  width: 92px;
  height: 92px;
  border: 5px double var(--orange);
  border-radius: 50%;
  font-size: 28px;
  letter-spacing: -2px;
  box-shadow: 0 0 18px rgba(245, 130, 42, 0.2);
}

.random-result .dice-face {
  font-size: 82px;
  line-height: 1;
  color: var(--orange);
}

.random-actions {
  display: flex;
  gap: 8px;
}

.random-actions button {
  flex: 1;
  min-height: 44px;
  border: 2px solid var(--orange-dark);
  border-radius: 11px;
  background: var(--panel);
  color: var(--orange);
  font-size: 12px;
  font-weight: 850;
  letter-spacing: 0.5px;
}

.random-actions button.primary {
  background: linear-gradient(145deg, #ff963f, #d9600d);
  color: #fff;
  border-color: #ff9b45;
}

.random-actions button:disabled {
  opacity: 0.7;
}

/* Storico LP */
.history-dialog {
  width: 100%;
  max-width: 370px;
  max-height: min(75dvh, 560px);
  display: flex;
  flex-direction: column;
  padding: 18px;
  border: 2px solid var(--orange-dark);
  border-radius: 20px;
  background: linear-gradient(145deg, #38322e, var(--panel-dark));
  color: var(--cream);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
}

.history-title {
  margin: 0 0 5px;
  color: var(--orange);
  text-align: center;
  font-size: 16px;
  letter-spacing: 1px;
}

.history-subtitle {
  margin: 0 0 14px;
  color: var(--muted);
  text-align: center;
  font-size: 12px;
}

.history-list {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.history-item {
  padding: 10px;
  border: 1px solid #66584c;
  border-radius: 10px;
  background: #211e1c;
}

.history-operation {
  margin-bottom: 5px;
  color: var(--orange);
  font-size: 12px;
  font-weight: 800;
}

.history-values {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--cream);
  font-size: 14px;
  font-weight: 750;
}

.history-empty {
  padding: 22px 8px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

.history-close {
  flex: 0 0 auto;
  width: 100%;
  min-height: 42px;
  margin-top: 12px;
  border: 2px solid var(--orange-dark);
  border-radius: 11px;
  background: var(--panel);
  color: var(--orange);
  font-size: 12px;
  font-weight: 850;
  letter-spacing: 0.5px;
}

@media (max-height: 700px) {
  .app {
    padding: 5px 8px;
    gap: 5px;
  }

  .player {
    padding: 6px;
    gap: 5px;
  }

  .lp {
    padding: 5px 0;
    font-size: clamp(23px, 7vw, 34px);
  }

  .btn.big {
    min-height: 35px;
  }

  .btn {
    min-height: 30px;
    padding: 3px 1px;
  }

  .amountbox {
    padding: 6px 8px;
  }

  .preset {
    min-height: 31px;
  }

  .customrow {
    margin-top: 5px;
  }

  .customrow input {
    padding: 5px 7px;
  }

  #clearAmount {
    flex-basis: 27px;
    width: 27px;
    height: 27px;
  }

  .notesbox {
    padding: 6px 8px;
  }

  .notes-sections {
    gap: 5px;
  }

  .note-part {
    gap: 3px;
  }

  .note-part-title {
    font-size: 11px;
  }

  .note-text {
    padding: 6px 8px;
    line-height: 1.3;
  }

  .newduel,
  .random-btn {
    min-height: 36px;
  }

  .random-btn {
    flex-basis: 40px;
    width: 40px;
    font-size: 20px;
    line-height: 1;
  }

  .coin-icon {
    width: 24px;
    height: 24px;
  }

  .calculator-keys {
    gap: 6px;
  }

  .calculator-keys button {
    min-height: 42px;
  }

  .random-dialog {
    padding: 18px 16px 14px;
  }

  .random-result {
    min-height: 95px;
    margin: 5px 0 14px;
  }

  .random-result .coin-icon {
    width: 76px;
    height: 76px;
  }

  .random-result .dice-face {
    font-size: 70px;
  }
}

@media (prefers-reduced-motion: reduce) {
  button,
  .lp,
  .random-result,
  .random-result.rolling {
    transition: none;
  }
}
</style>
</head>

<body>
<main class="app">

<section class="players">
  <article class="player">
    <h2>AVVERSARIO</h2>
    <button class="lp" id="lp1" type="button"
      aria-label="Apri lo storico dei Life Points dell'avversario">8000</button>
    <div class="controls">
      <button class="btn big" data-player="1" data-sign="-">−</button>
      <button class="btn big plus" data-player="1" data-sign="+">+</button>
      <button class="btn half" data-action="half" data-player="1">½ LP</button>
      <button class="btn reset" data-action="reset" data-player="1">Reset</button>
    </div>
  </article>

  <article class="player">
    <h2>TU</h2>
    <button class="lp" id="lp2" type="button"
      aria-label="Apri il tuo storico dei Life Points">8000</button>
    <div class="controls">
      <button class="btn big" data-player="2" data-sign="-">−</button>
      <button class="btn big plus" data-player="2" data-sign="+">+</button>
      <button class="btn half" data-action="half" data-player="2">½ LP</button>
      <button class="btn reset" data-action="reset" data-player="2">Reset</button>
    </div>
  </article>
</section>

<section class="amountbox">
  <h2 class="section-title">IMPORTO OPERAZIONI</h2>
  <div class="accent-line"></div>

  <div class="presets">
    <button class="preset" data-amount="200">200</button>
    <button class="preset" data-amount="500">500</button>
    <button class="preset active" data-amount="1000">1000</button>
    <button class="preset" data-amount="3000">3000</button>
    <button class="preset undo" id="undo" aria-label="Annulla ultima operazione">↶</button>
  </div>

  <div class="customrow">
    <label for="amount">Personalizza:</label>
    <button type="button" id="clearAmount"
      aria-label="Cancella importo personalizzato"
      title="Cancella importo">×</button>
    <input id="amount" type="number" inputmode="numeric"
      min="0" max="999999" value="1000" placeholder="Importo"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
</section>

<section class="notesbox">
  <div class="notes-head">
    <h2 class="section-title">NOTE DEL DUELLO</h2>
    <button class="iconbtn" id="clearNotes" aria-label="Cancella entrambe le sezioni delle note">⌫</button>
  </div>
  <div class="accent-line"></div>

  <div class="notes-sections">
    <section class="note-part">
      <h3 class="note-part-title">SIDARE</h3>
      <textarea id="notesSidare" class="note-text"
        placeholder="Carte da togliere e inserire..."
        autocomplete="off" autocorrect="off" autocapitalize="off"
        spellcheck="false" data-gramm="false"></textarea>
    </section>

    <section class="note-part">
      <h3 class="note-part-title">CARTE IN MANO</h3>
      <textarea id="notesHand" class="note-text"
        placeholder="Carte in mano e promemoria..."
        autocomplete="off" autocorrect="off" autocapitalize="off"
        spellcheck="false" data-gramm="false"></textarea>
    </section>
  </div>
</section>

<div class="bottom-actions">
  <button class="newduel" id="newDuel">↻ &nbsp; NUOVO DUELLO</button>

  <button class="random-btn" id="openCalculator"
    aria-label="Apri la calcolatrice" title="Calcolatrice">
    <span class="calculator-icon" aria-hidden="true">+ − × ÷</span>
  </button>

  <button class="random-btn" id="coinFlip"
    aria-label="Lancia una moneta" title="Lancia una moneta">
    <span class="coin-icon" aria-hidden="true">T/C</span>
  </button>

  <button class="random-btn" id="rollDice"
    aria-label="Lancia un dado" title="Lancia un dado">⚄</button>
</div>

</main>

<script>
const $ = id => document.getElementById(id);
const STORAGE_KEY = 'duel-assistant-data';

let history = [];
let duelLog = [];
let saveTimer;
let rollTimer = null;
const lpAnimationTimers = {};

function currentState() {
  return {
    lp1: $('lp1').textContent,
    lp2: $('lp2').textContent,
    amount: $('amount').value,
    notesSidare: $('notesSidare').value,
    notesHand: $('notesHand').value,
    duelLog
  };
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentState()));
  } catch (e) {}
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 150);
}

function remember() {
  history.push({
    lp1: $('lp1').textContent,
    lp2: $('lp2').textContent,
    duelLogLength: duelLog.length
  });

  if (history.length > 50) history.shift();
}

function animateLP(id) {
  const element = $(id);

  if (lpAnimationTimers[id]) {
    clearTimeout(lpAnimationTimers[id]);
  }

  element.classList.remove('lp-changed');
  void element.offsetWidth;
  element.classList.add('lp-changed');

  lpAnimationTimers[id] = setTimeout(() => {
    element.classList.remove('lp-changed');
    delete lpAnimationTimers[id];
  }, 320);
}

function addDuelLog(id, operation, before, after) {
  if (String(before) === String(after)) return;

  duelLog.push({
    player: id === 'lp1' ? 'AVVERSARIO' : 'TU',
    operation,
    before: Number(before),
    after: Number(after)
  });

  save();
}

function setLP(id, value, animate = true, operation = 'Modifica') {
  const element = $(id);
  const oldValue = Number(element.textContent) || 0;
  const newValue = Math.max(0, Math.min(999999,
    Math.floor(Number(value) || 0)));

  element.textContent = String(newValue);

  if (animate && newValue !== oldValue) {
    animateLP(id);
  }

  addDuelLog(id, operation, oldValue, newValue);
  save();
}

function selectedAmount() {
  return Math.max(0, Math.min(999999,
    Math.floor(Number($('amount').value) || 0)));
}

function selectPreset(n) {
  $('amount').value = n;
  updatePresetSelection();
  save();
}

function updatePresetSelection() {
  const value = $('amount').value;

  document.querySelectorAll('[data-amount]').forEach(button => {
    button.classList.toggle(
      'active',
      value !== '' && Number(button.dataset.amount) === selectedAmount()
    );
  });
}

document.querySelectorAll('[data-amount]').forEach(button => {
  button.addEventListener('click', () => {
    selectPreset(Number(button.dataset.amount));
  });
});

$('amount').addEventListener('input', () => {
  updatePresetSelection();
  save();
});

/* Mantiene la schermata ferma quando si apre la tastiera su iOS. */
$('amount').addEventListener('focus', () => {
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
});

$('amount').addEventListener('blur', () => {
  document.documentElement.style.overflow = '';
  document.body.style.overflow = '';
});

$('clearAmount').addEventListener('click', () => {
  $('amount').value = '';
  updatePresetSelection();
  save();
  $('amount').focus({ preventScroll: true });
});

/* Operazioni sui Life Points e registrazione nello storico. */
document.querySelectorAll('[data-player]').forEach(button => {
  button.addEventListener('click', () => {
    const id = 'lp' + button.dataset.player;
    const action = button.dataset.action;
    const current = Number($(id).textContent) || 0;
    const delta = selectedAmount();

    let next;
    let operation;

    if (action === 'half') {
      next = Math.floor(current / 2);
      operation = 'Dimezzamento LP';
    } else if (action === 'reset') {
      next = 8000;
      operation = 'Reset a 8000 LP';
    } else if (button.dataset.sign === '+') {
      next = current + delta;
      operation = 'Aggiunti ' + delta + ' LP';
    } else {
      next = current - delta;
      operation = 'Sottratti ' + delta + ' LP';
    }

    remember();
    setLP(id, next, true, operation);
  });
});

/* Storico individuale: dalla prima operazione all'ultima. */
function openHistory(id) {
  const playerName = id === 'lp1' ? 'AVVERSARIO' : 'TU';

  const playerEntries = duelLog.filter(
    entry => entry.player === playerName
  );

  const overlay = document.createElement('div');
  overlay.className = 'random-overlay';

  const dialog = document.createElement('section');
  dialog.className = 'history-dialog';
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.setAttribute('aria-label', 'Storico Life Points ' + playerName);

  const title = document.createElement('h2');
  title.className = 'history-title';
  title.textContent = 'STORICO LP';

  const subtitle = document.createElement('p');
  subtitle.className = 'history-subtitle';
  subtitle.textContent = playerName;

  const list = document.createElement('div');
  list.className = 'history-list';

  if (playerEntries.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = 'Nessuna variazione registrata in questo duello.';
    list.appendChild(empty);
  } else {
    /*
      Le operazioni vengono mostrate nell'ordine in cui sono state
      registrate: la prima è la numero 1, l'ultima ha il numero più alto.
      La numerazione riparte da 1 per ciascun giocatore.
    */
    playerEntries.forEach((entry, index) => {
      const item = document.createElement('div');
      item.className = 'history-item';

      const operation = document.createElement('div');
      operation.className = 'history-operation';
      operation.textContent = `${index + 1}. ${entry.operation}`;

      const values = document.createElement('div');
      values.className = 'history-values';

      const before = document.createElement('span');
      before.textContent =
        Number(entry.before).toLocaleString('it-IT') + ' LP';

      const arrow = document.createElement('span');
      arrow.textContent = '→';
      arrow.style.color = 'var(--orange)';

      const after = document.createElement('span');
      after.textContent =
        Number(entry.after).toLocaleString('it-IT') + ' LP';

      values.append(before, arrow, after);
      item.append(operation, values);
      list.appendChild(item);
    });
  }

  const close = document.createElement('button');
  close.type = 'button';
  close.className = 'history-close';
  close.textContent = 'CHIUDI';

  function closeDialog() {
    overlay.remove();
  }

  close.addEventListener('click', closeDialog);

  overlay.addEventListener('click', event => {
    if (event.target === overlay) closeDialog();
  });

  dialog.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeDialog();
  });

  dialog.append(title, subtitle, list, close);
  overlay.appendChild(dialog);
  document.body.appendChild(overlay);
  close.focus();
}

$('lp1').addEventListener('click', () => openHistory('lp1'));
$('lp2').addEventListener('click', () => openHistory('lp2'));

/* Annulla l'ultima operazione e aggiorna entrambi gli storici. */
$('undo').addEventListener('click', () => {
  const previous = history.pop();

  if (!previous) {
    alert('Nessuna operazione da annullare.');
    return;
  }

  $('lp1').textContent = previous.lp1;
  $('lp2').textContent = previous.lp2;

  duelLog = duelLog.slice(0, previous.duelLogLength);

  animateLP('lp1');
  animateLP('lp2');
  save();
});

/* Salvataggio indipendente delle due sezioni delle note. */
$('notesSidare').addEventListener('input', scheduleSave);
$('notesHand').addEventListener('input', scheduleSave);

$('clearNotes').addEventListener('click', () => {
  if (confirm('Cancellare sia le note di Sidare sia quelle delle Carte in mano?')) {
    $('notesSidare').value = '';
    $('notesHand').value = '';
    save();
  }
});

/* Nuovo duello: azzera anche lo storico e la cronologia Undo. */
$('newDuel').addEventListener('click', () => {
  if (confirm('Iniziare un nuovo duello? I Life Points torneranno a 8000 e le note saranno cancellate.')) {
    history = [];
    duelLog = [];

    $('lp1').textContent = '8000';
    $('lp2').textContent = '8000';

    animateLP('lp1');
    animateLP('lp2');

    $('notesSidare').value = '';
    $('notesHand').value = '';

    save();
  }
});

/* Calcolatrice: trasferisce il risultato in Personalizza alla chiusura. */
function openCalculator() {
  const overlay = document.createElement('div');
  overlay.className = 'random-overlay';

  const dialog = document.createElement('section');
  dialog.className = 'calculator-dialog';
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.setAttribute('aria-label', 'Calcolatrice');

  const title = document.createElement('h2');
  title.className = 'calculator-title';
  title.textContent = 'CALCOLATRICE';

  const display = document.createElement('div');
  display.className = 'calculator-display';
  display.setAttribute('aria-live', 'polite');

  const expression = document.createElement('div');
  expression.className = 'calculator-expression';

  const value = document.createElement('div');
  value.className = 'calculator-value';

  display.append(expression, value);

  const keys = document.createElement('div');
  keys.className = 'calculator-keys';
  keys.innerHTML = `
    <button type="button" class="clear" data-key="clear">AC</button>
    <button type="button" class="clear" data-key="backspace" aria-label="Cancella ultima cifra">⌫</button>
    <button type="button" class="operator" data-key="÷" aria-label="Diviso">÷</button>
    <button type="button" class="operator" data-key="×" aria-label="Per">×</button>
    <button type="button" data-key="7">7</button>
    <button type="button" data-key="8">8</button>
    <button type="button" data-key="9">9</button>
    <button type="button" class="operator" data-key="−" aria-label="Meno">−</button>
    <button type="button" data-key="4">4</button>
    <button type="button" data-key="5">5</button>
    <button type="button" data-key="6">6</button>
    <button type="button" class="operator" data-key="+">+</button>
    <button type="button" data-key="1">1</button>
    <button type="button" data-key="2">2</button>
    <button type="button" data-key="3">3</button>
    <button type="button" class="equals" data-key="=">=</button>
    <button type="button" data-key="0" style="grid-column: span 2">0</button>
    <button type="button" data-key=".">.</button>
    <button type="button" class="operator" data-key="±" aria-label="Cambia segno">±</button>`;

  const close = document.createElement('button');
  close.type = 'button';
  close.className = 'calculator-close';
  close.textContent = 'CHIUDI';

  let current = '0';
  let stored = null;
  let operator = null;
  let replaceCurrent = false;
  let error = false;
  let justCalculated = false;
  let transferred = false;

  const symbols = { '+': '+', '−': '−', '×': '×', '÷': '÷' };

  const format = number => {
    if (!Number.isFinite(number)) return 'Errore';
    const rounded = Number(number.toPrecision(11));
    return Object.is(rounded, -0) ? '0' : String(rounded);
  };

  function compute(left, op, right) {
    if (!Number.isFinite(left) || !Number.isFinite(right)) return null;

    let result;

    if (op === '+') result = left + right;
    else if (op === '−') result = left - right;
    else if (op === '×') result = left * right;
    else if (op === '÷') {
      if (right === 0) return null;
      result = left / right;
    } else {
      return null;
    }

    return Number.isFinite(result) ? result : null;
  }

  function getDisplayedResult() {
    if (error) return null;

    if (operator && stored !== null && !replaceCurrent) {
      return compute(stored, operator, Number(current));
    }

    const displayed = value.textContent.trim();

    if (!displayed || displayed === 'Errore' || displayed === '÷ 0') {
      return null;
    }

    const result = Number(displayed);

    return Number.isFinite(result) ? result : null;
  }

  function transferResult() {
    if (transferred) return;

    const result = getDisplayedResult();

    if (result === null) return;

    const normalized = Math.max(0, Math.min(999999, Math.floor(result)));

    $('amount').value = String(normalized);
    updatePresetSelection();
    save();

    transferred = true;
  }

  function update() {
    value.textContent = error ? 'Errore' : current;
    value.style.fontSize = current.length > 10
      ? 'clamp(20px, 6vw, 28px)'
      : '';

    if (operator && stored !== null && !error) {
      const left = format(stored);

      expression.textContent =
        `${left} ${symbols[operator]} ${replaceCurrent ? '' : current}`;

      if (!replaceCurrent) {
        const preview = compute(stored, operator, Number(current));

        if (preview !== null) {
          value.textContent = format(preview);
        } else if (operator === '÷' && Number(current) === 0) {
          value.textContent = '÷ 0';
        }
      }
    } else {
      expression.textContent = justCalculated ? 'Risultato' : '';
    }
  }

  function reset() {
    current = '0';
    stored = null;
    operator = null;
    replaceCurrent = false;
    error = false;
    justCalculated = false;
    update();
  }

  function enterDigit(digit) {
    if (error || replaceCurrent) {
      current = digit === '.' ? '0.' : digit;
      replaceCurrent = false;
      error = false;
      justCalculated = false;
    } else if (digit === '.') {
      if (!current.includes('.')) current += '.';
    } else if (current === '0') {
      current = digit;
    } else if (current.replace('-', '').replace('.', '').length < 15) {
      current += digit;
    }

    update();
  }

  function chooseOperator(nextOperator) {
    if (error) return;

    const parsed = Number(current);

    if (!Number.isFinite(parsed)) {
      error = true;
      update();
      return;
    }

    if (operator && stored !== null && !replaceCurrent) {
      const result = compute(stored, operator, parsed);

      if (result === null) {
        error = true;
        current = '0';
        operator = null;
        stored = null;
        update();
        return;
      }

      current = format(result);
      stored = result;
    } else {
      stored = parsed;
    }

    operator = nextOperator;
    replaceCurrent = true;
    justCalculated = false;
    update();
  }

  function equals() {
    if (error || !operator || stored === null || replaceCurrent) return;

    const result = compute(stored, operator, Number(current));

    if (result === null) {
      error = true;
      current = '0';
    } else {
      current = format(result);
      justCalculated = true;
    }

    stored = null;
    operator = null;
    replaceCurrent = true;
    update();
  }

  function press(key) {
    if (/^\d$/.test(key) || key === '.') {
      enterDigit(key);
      return;
    }

    if (key === 'clear') {
      reset();
      return;
    }

    if (key === 'backspace') {
      if (error || replaceCurrent) {
        current = '0';
        error = false;
        replaceCurrent = false;
      } else {
        current = current.length > 1 ? current.slice(0, -1) : '0';
      }

      if (current === '-') current = '0';

      update();
      return;
    }

    if (key === '±') {
      if (!error && current !== '0') {
        current = current.startsWith('-')
          ? current.slice(1)
          : '-' + current;
      }

      update();
      return;
    }

    if (['+', '−', '×', '÷'].includes(key)) {
      chooseOperator(key);
      return;
    }

    if (key === '=') equals();
  }

  function closeDialog() {
    transferResult();
    overlay.remove();
  }

  keys.addEventListener('click', event => {
    const button = event.target.closest('button[data-key]');
    if (button) press(button.dataset.key);
  });

  close.addEventListener('click', closeDialog);

  overlay.addEventListener('click', event => {
    if (event.target === overlay) closeDialog();
  });

  dialog.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      event.preventDefault();
      closeDialog();
    } else if (/^\d$/.test(event.key)) {
      press(event.key);
    } else if (event.key === '.') {
      press('.');
    } else if (event.key === '+') {
      press('+');
    } else if (event.key === '-') {
      press('−');
    } else if (event.key === '*') {
      press('×');
    } else if (event.key === '/') {
      event.preventDefault();
      press('÷');
    } else if (event.key === 'Enter' || event.key === '=') {
      press('=');
    } else if (event.key === 'Backspace') {
      press('backspace');
    }
  });

  dialog.append(title, display, keys, close);
  overlay.appendChild(dialog);
  document.body.appendChild(overlay);

  update();
  keys.querySelector('button').focus();
}

$('openCalculator').addEventListener('click', openCalculator);

/* Finestra casuale con animazione a ogni rilancio. */
function openRandomDialog(type) {
  const overlay = document.createElement('div');
  overlay.className = 'random-overlay';

  const dialog = document.createElement('div');
  dialog.className = 'random-dialog';
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.setAttribute(
    'aria-label',
    type === 'coin' ? 'Risultato della moneta' : 'Risultato del dado'
  );

  const result = document.createElement('div');
  result.className = 'random-result';
  result.setAttribute('aria-live', 'polite');

  const actions = document.createElement('div');
  actions.className = 'random-actions';

  const reroll = document.createElement('button');
  reroll.className = 'primary';
  reroll.textContent = 'RILANCIA';

  const close = document.createElement('button');
  close.textContent = 'CHIUDI';

  let rolling = false;

  function showResult() {
    result.replaceChildren();

    if (type === 'coin') {
      const isHeads = Math.random() < 0.5;
      const coin = document.createElement('span');

      coin.className = 'coin-icon';
      coin.textContent = isHeads ? 'T' : 'C';
      coin.setAttribute('aria-label', isHeads ? 'Testa' : 'Croce');

      result.appendChild(coin);
    } else {
      const value = Math.floor(Math.random() * 6) + 1;
      const faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
      const dice = document.createElement('span');

      dice.className = 'dice-face';
      dice.textContent = faces[value - 1];
      dice.setAttribute('aria-label', 'Risultato ' + value);

      result.appendChild(dice);
    }
  }

  function roll() {
    if (rolling) return;

    rolling = true;
    reroll.disabled = true;
    result.classList.add('rolling');

    if (rollTimer !== null) {
      clearTimeout(rollTimer);
    }

    rollTimer = setTimeout(() => {
      showResult();

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          result.classList.remove('rolling');
          reroll.disabled = false;
          rolling = false;
          rollTimer = null;
        });
      });
    }, 350);
  }

  function closeDialog() {
    if (rollTimer !== null) {
      clearTimeout(rollTimer);
      rollTimer = null;
    }

    overlay.remove();
  }

  reroll.addEventListener('click', roll);
  close.addEventListener('click', closeDialog);

  overlay.addEventListener('click', event => {
    if (event.target === overlay) closeDialog();
  });

  dialog.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeDialog();
  });

  actions.append(reroll, close);
  dialog.append(result, actions);
  overlay.appendChild(dialog);
  document.body.appendChild(overlay);

  showResult();
  close.focus();
}

$('coinFlip').addEventListener('click', () => {
  openRandomDialog('coin');
});

$('rollDice').addEventListener('click', () => {
  openRandomDialog('dice');
});

/* Ripristino dei dati salvati all'avvio. */
try {
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');

  if (data) {
    if (data.lp1 !== undefined) $('lp1').textContent = data.lp1;
    if (data.lp2 !== undefined) $('lp2').textContent = data.lp2;
    if (data.amount !== undefined) $('amount').value = data.amount;

    if (data.notesSidare !== undefined) {
      $('notesSidare').value = data.notesSidare;
    } else if (data.notes !== undefined) {
      $('notesSidare').value = data.notes;
    }

    if (data.notesHand !== undefined) {
      $('notesHand').value = data.notesHand;
    }

    if (Array.isArray(data.duelLog)) {
      duelLog = data.duelLog;
    }

    updatePresetSelection();
  }
} catch (e) {}
