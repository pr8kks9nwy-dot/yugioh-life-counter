
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b7aa9a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Duel Assistant">
<title>Duel Assistant</title>

<style>
:root {
  --taupe: #b7aa9a;
  --panel: #302c29;
  --panel-dark: #211e1c;
  --orange: #f5822a;
  --orange-dark: #c85b10;
  --cream: #f5ede2;
  --muted: #c2b8ac;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  height: 100%;
  background: var(--taupe);
}

body {
  margin: 0;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--taupe);
  color: var(--panel);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
}

.app {
  width: 100%;
  max-width: 700px;
  height: 100%;
  margin: 0 auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  overflow: hidden;
}

.players {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  flex: 0 0 auto;
  min-height: 0;
}

.player {
  min-width: 0;
  padding: 9px 7px;
  border: 2px solid #77695b;
  border-top: 4px solid var(--orange);
  border-radius: 17px;
  background: linear-gradient(145deg, #38322e, var(--panel-dark));
  color: var(--cream);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.player h2 {
  color: var(--orange);
  font-size: clamp(12px, 3.4vw, 17px);
  text-align: center;
  margin: 1px 0 3px;
  letter-spacing: 1px;
}

.lp {
  width: 100%;
  min-width: 0;
  background: #171513;
  border: 2px solid #554b43;
  border-radius: 12px;
  color: var(--cream);
  font-size: clamp(25px, 7.5vw, 43px);
  font-weight: 800;
  text-align: center;
  padding: 9px 0;
  letter-spacing: 1px;
  appearance: textfield;
  -moz-appearance: textfield;
}

.lp::-webkit-inner-spin-button,
.lp::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.edit-hint {
  font-size: 11px;
  text-align: center;
  color: var(--muted);
  margin: 0;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: auto;
}

.btn {
  min-width: 0;
  min-height: 37px;
  border: 2px solid var(--orange-dark);
  border-radius: 11px;
  background: transparent;
  color: var(--orange);
  font-weight: 750;
  padding: 6px 2px;
}

.btn.big {
  min-height: 45px;
  font-size: 27px;
  color: var(--cream);
}

.btn.plus {
  background: linear-gradient(145deg, #ff963f, #d9600d);
  border-color: #ff9b45;
}

.btn.half,
.btn.reset {
  font-size: 12px;
}

.amountbox {
  flex: 0 0 auto;
  padding: 8px 10px;
  background: #c8bbab;
  border: 1px solid #d9cdbf;
  border-radius: 14px;
}

.section-title {
  color: var(--orange);
  font-weight: 850;
  font-size: 13px;
  letter-spacing: 1.2px;
  margin: 0 0 5px;
}

.presets {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
}

.preset {
  min-width: 0;
  min-height: 37px;
  padding: 5px 1px;
  background: var(--panel);
  color: var(--cream);
  border: 2px solid #74675b;
  border-radius: 9px;
  font-weight: 750;
  font-size: clamp(10px, 3vw, 14px);
}

.preset.active {
  background: var(--orange-dark);
  border-color: #ffad65;
}

.preset.undo {
  color: var(--orange);
  border-color: var(--orange-dark);
  font-size: 17px;
}

.customrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.customrow label {
  color: var(--panel);
  font-size: 12px;
  font-weight: 750;
  white-space: nowrap;
}

#amount {
  width: 100%;
  min-width: 0;
  background: var(--panel);
  color: var(--cream);
  border: 2px solid var(--orange);
  border-radius: 9px;
  padding: 7px 9px;
  font-size: 16px;
}

.notesbox {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 8px 9px;
  background: #c8bbab;
  border: 1px solid #d9cdbf;
  border-radius: 14px;
}

.notes-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex: 0 0 auto;
}

.notes-head .section-title {
  margin: 0 0 4px;
}

.iconbtn {
  flex: 0 0 auto;
  background: #a89b8b;
  border: 1px solid #948777;
  border-radius: 9px;
  padding: 4px 9px;
  color: var(--panel);
  font-size: 18px;
}

.accent-line {
  flex: 0 0 auto;
  height: 3px;
  width: 55%;
  background: var(--orange);
  border-radius: 3px;
  margin: 3px 0 7px;
}

#notes {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  resize: none;
  background: var(--panel);
  color: var(--cream);
  border: 2px solid #77695b;
  border-radius: 11px;
  padding: 10px;
  font-size: 14px;
  line-height: 1.45;
}

#notes::placeholder {
  color: #a99e93;
}

.newduel {
  flex: 0 0 auto;
  width: 100%;
  min-height: 43px;
  border: 2px solid #ad4b0c;
  border-radius: 12px;
  padding: 9px;
  background: linear-gradient(110deg, #ff963f, #d9600d);
  color: white;
  font-weight: 850;
  letter-spacing: 1.5px;
  font-size: 14px;
}

@media (max-height: 700px) {
  .app {
    padding: 5px 8px;
    gap: 5px;
  }

  .player {
    padding: 6px;
    gap: 5px;
  }

  .lp {
    padding: 5px 0;
    font-size: clamp(23px, 7vw, 34px);
  }

  .btn.big {
    min-height: 35px;
  }

  .btn {
    min-height: 30px;
    padding: 3px 1px;
  }

  .amountbox {
    padding: 6px 8px;
  }

  .preset {
    min-height: 31px;
  }

  .customrow {
    margin-top: 5px;
  }

  .customrow input {
    padding: 5px 7px;
  }

  .notesbox {
    padding: 6px 8px;
  }

  .newduel {
    min-height: 36px;
    padding: 6px;
  }
}
</style>
</head>

<body>
<main class="app">

<section class="players">
  <article class="player">
    <h2>AVVERSARIO</h2>
    <input class="lp" id="lp1" type="number"
      inputmode="numeric" min="0" max="999999"
      value="8000" aria-label="Life Points avversario">
    <div class="edit-hint">✎ Tocca per modificare</div>
    <div class="controls">
      <button class="btn big" data-player="1" data-sign="-">−</button>
      <button class="btn big plus" data-player="1" data-sign="+">+</button>
      <button class="btn half" data-action="half" data-player="1">½ LP</button>
      <button class="btn reset" data-action="reset" data-player="1">Reset</button>
    </div>
  </article>

  <article class="player">
    <h2>TU</h2>
    <input class="lp" id="lp2" type="number"
      inputmode="numeric" min="0" max="999999"
      value="8000" aria-label="I tuoi Life Points">
    <div class="edit-hint">✎ Tocca per modificare</div>
    <div class="controls">
      <button class="btn big" data-player="2" data-sign="-">−</button>
      <button class="btn big plus" data-player="2" data-sign="+">+</button>
      <button class="btn half" data-action="half" data-player="2">½ LP</button>
      <button class="btn reset" data-action="reset" data-player="2">Reset</button>
    </div>
  </article>
</section>

<section class="amountbox">
  <h2 class="section-title">IMPORTO OPERAZIONI</h2>
  <div class="accent-line"></div>

  <div class="presets">
    <button class="preset" data-amount="200">200</button>
    <button class="preset" data-amount="500">500</button>
    <button class="preset active" data-amount="1000">1000</button>
    <button class="preset" data-amount="3000">3000</button>
    <button class="preset undo" id="undo" aria-label="Annulla ultima operazione">↶</button>
  </div>

  <div class="customrow">
    <label for="amount">Personalizza:</label>
    <input id="amount" type="number" inputmode="numeric"
      min="0" max="999999" value="1000" placeholder="Importo">
  </div>
</section>

<section class="notesbox">
  <div class="notes-head">
    <h2 class="section-title">NOTE DEL DUELLO</h2>
    <button class="iconbtn" id="clearNotes" aria-label="Cancella note">⌫</button>
  </div>
  <div class="accent-line"></div>
  <textarea id="notes"
    placeholder="Scrivi effetti, carte, calcoli o promemoria..."></textarea>
</section>

<button class="newduel" id="newDuel">↻ &nbsp; NUOVO DUELLO</button>

</main>

<script>
const $ = id => document.getElementById(id);
const STORAGE_KEY = 'duel-assistant-data';

let history = [];
let saveTimer;

function currentState() {
  return {
    lp1: $('lp1').value,
    lp2: $('lp2').value,
    amount: $('amount').value,
    notes: $('notes').value
  };
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentState()));
  } catch (e) {}
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 150);
}

function remember() {
  history.push({
    lp1: $('lp1').value,
    lp2: $('lp2').value
  });

  if (history.length > 50) history.shift();
}

function setLP(id, value) {
  const n = Math.floor(Number(value) || 0);
  $(id).value = Math.max(0, Math.min(999999, n));
  save();
}

function selectedAmount() {
  return Math.max(0, Math.min(999999,
    Math.floor(Number($('amount').value) || 0)));
}

function selectPreset(n) {
  $('amount').value = n;

  document.querySelectorAll('[data-amount]').forEach(button => {
    button.classList.toggle(
      'active',
      Number(button.dataset.amount) === n
    );
  });

  save();
}

document.querySelectorAll('[data-amount]').forEach(button => {
  button.addEventListener('click', () => {
    selectPreset(Number(button.dataset.amount));
  });
});

$('amount').addEventListener('input', () => {
  document.querySelectorAll('[data-amount]').forEach(button => {
    button.classList.toggle(
      'active',
      Number(button.dataset.amount) === selectedAmount()
    );
  });

  save();
});

document.querySelectorAll('.lp').forEach(input => {
  input.addEventListener('change', () => {
    remember();
    setLP(input.id, input.value);
  });
});

document.querySelectorAll('[data-player]').forEach(button => {
  button.addEventListener('click', () => {
    const id = 'lp' + button.dataset.player;
    const action = button.dataset.action;
    const current = Number($(id).value) || 0;

    remember();

    if (action === 'half') {
      setLP(id, Math.floor(current / 2));
    } else if (action === 'reset') {
      setLP(id, 8000);
    } else {
      const delta = selectedAmount();
      const next = current +
        (button.dataset.sign === '+' ? delta : -delta);

      setLP(id, next);
    }
  });
});

$('undo').addEventListener('click', () => {
  const previous = history.pop();

  if (!previous) {
    alert('Nessuna operazione da annullare.');
    return;
  }

  $('lp1').value = previous.lp1;
  $('lp2').value = previous.lp2;
  save();
});

$('notes').addEventListener('input', scheduleSave);

$('clearNotes').addEventListener('click', () => {
  if (confirm('Cancellare tutte le note?')) {
    $('notes').value = '';
    save();
  }
});

$('newDuel').addEventListener('click', () => {
  if (confirm('Iniziare un nuovo duello? I Life Points torneranno a 8000 e le note saranno cancellate.')) {
    remember();
    $('lp1').value = 8000;
    $('lp2').value = 8000;
    $('notes').value = '';
    save();
  }
});

try {
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');

  if (data) {
    if (data.lp1 !== undefined) $('lp1').value = data.lp1;
    if (data.lp2 !== undefined) $('lp2').value = data.lp2;
    if (data.amount !== undefined) $('amount').value = data.amount;
    if (data.notes !== undefined) $('notes').value = data.notes;

    document.querySelectorAll('[data-amount]').forEach(button => {
      button.classList.toggle(
        'active',
        Number(button.dataset.amount) === selectedAmount()
      );
    });
  }
} catch (e) {}

if ('serviceWorker' in navigator &&
    location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
